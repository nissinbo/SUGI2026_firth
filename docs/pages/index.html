<!doctype html>

<head>

  <title>発表スライド | SASユーザー総会2026</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; }

    body { margin: 0; background: #f4f6f8; color: #182434; }

    .viewer { background: #fff; border: 1px solid #d7e0e8; border-radius: 10px; overflow: hidden; }
    iframe { width: 100%; height: min(78vh, 900px); min-height: 480px; border: 0; display: block; }
    .note { font-size: .85rem; color: #566477; margin-top: 12px; }
    @media (max-width: 600px) {
      main { padding: 16px 12px 24px; }
